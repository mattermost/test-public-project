---
name: E2E Test Stack - Destroy

# Releases a batch that an "E2E Test Stack - Run" workflow run kept (its keep
# input), from that run's create response, then checks every site stops
# serving. A batch already gone (reaped at its TTL, or destroyed before) is
# "not found", and passes.

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "The \"E2E Test Stack - Run\" workflow run that created the batch (the number in its URL)"
        required: true
        type: string
      channel:
        description: "Control plane channel the batch was created on"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  destroy:
    runs-on: ubuntu-24.04
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: e2e-test-stack/scripts

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: ci/download-create-response
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: e2e-test-stack-create
          run-id: ${{ inputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/create

      - name: ci/configure-aws-credentials
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd  # v6.3.0
        with:
          role-to-assume: ${{ vars.MM_E2E_TEST_STACK_AWS_ROLE_ARN }}
          aws-region: us-east-1

      - name: ci/destroy
        id: destroy
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-stack@d80d7af29e0b1056ae95efed3ef3b2a112e7e77f  # toolkit #21
        with:
          operation: destroy
          caller-key: test-public-project
          channel: ${{ inputs.channel }}
          private-key: ${{ secrets.E2E_STACK_PRIVATE_KEY }}
          create-response: ${{ runner.temp }}/create/e2e-test-stack-create.json

      - name: ci/assert-destroyed
        env:
          STATE: ${{ steps.destroy.outputs.state }}
        run: |
          case "$STATE" in
            destroyed) ;;
            "not found") echo "already gone" ;;
            *)
              echo "::error::destroy says state '${STATE}', want destroyed or 'not found'"
              exit 1
              ;;
          esac

      - name: ci/probe-gone
        if: steps.destroy.outputs.state == 'destroyed'
        env:
          SITES: ${{ steps.destroy.outputs.sites }}
        run: e2e-test-stack/scripts/probe-gone.sh
