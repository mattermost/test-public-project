---
name: E2E Test Stack - Mobile v2
run-name: "Mobile E2E v2 (${{ inputs.lane }}) · ${{ inputs.mobile_test_branch }} · ${{ inputs.specs != '' && 'selected specs' || 'Detox configuration' }} · ${{ inputs.parallelism }} worker(s)"

# By hand only: runs one lane of mattermost-mobile's Detox suite the way mobile's v2 templates do
# (e2e-ios-template-v2.yml, e2e-android-template-v2.yml): one batch, a server per Test System IO worker (at least 3 on
# iOS and Android, whose SITE_2 and SITE_3 are two of servers 0-2), specs that set up their own server state, and
# production Test System IO leasing specs onto the workers, to prove the pipeline before mobile's pull requests merge.
# The app is not built here: the run takes the build a mobile E2E run uploaded, by its artifact link
# (ios-build-simulator-* for detox-ios and detox-ipad, android-build-files-* for detox-android). The
# tests run from mobile_test_sha on mobile_test_branch (or the branch's head), which may differ from the build's
# commit only under detox/ and .github/ and in Markdown files. Results go to Test System IO under this repository as
# mobile-v2-<lane>.
#
# When the lane passes, or the run is cancelled, the batch is destroyed; when it fails, its logs are collected and
# the batch is kept, so "Re-run failed jobs" re-runs the failed workers on it and then destroys it. The batch lives 4
# hours from create, so a re-run must start well within that.
#
# Jobs marked "test-public-project:" exist only to run mobile's lane here; the others mirror a job in mobile's
# e2e-test-ci.yml, named in their comment.

on:
  workflow_dispatch:
    inputs:
      lane:
        description: "Lane to run; the build artifact must be its platform's"
        required: true
        type: choice
        options: ["detox-ios", "detox-ipad", "detox-android"]
      build_artifact:
        description: "Link to an ios-build-simulator-* or android-build-files-* artifact of a mattermost-mobile run, e.g. https://github.com/mattermost/mattermost-mobile/actions/runs/<run>/artifacts/<id>"
        required: true
        type: string
      mobile_test_branch:
        description: "mattermost-mobile branch whose tests run; its app files must match the build's commit"
        required: false
        type: string
        default: "e2e-tests-provision"
      mobile_test_sha:
        description: "A commit SHA (7 to 40 hex characters) on mobile_test_branch to test; empty for the branch's head"
        required: false
        type: string
        default: "746905cc87aa6ec56fde1eec1a28e6ea5d40d44d"
      specs:
        description: "Space-separated specs relative to detox/ to queue, e.g. e2e/test/products/channels/smoke_test/account.e2e.ts; empty for every spec of the lane's Detox configuration"
        required: false
        type: string
        default: ""
      parallelism:
        description: "Test System IO workers, 1 to 32, each on its own server"
        required: false
        type: string
        default: "4"
      account:
        description: "AWS account whose control plane runs the batch"
        required: false
        type: choice
        options: ["prod", "dev"]
        default: "prod"
      channel:
        description: "Control plane channel"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"
      server_image:
        description: "Mattermost enterprise server image (mattermost/ or mattermostdevelopment/), by tag. Empty is the latest mattermost/mattermost release"
        required: false
        type: string
        default: ""
      android_runner:
        description: "Runner for the Android workers; only ubuntu-24.04 until this repository is granted a larger runner"
        required: false
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

env:
  MOBILE_REPOSITORY: mattermost/mattermost-mobile

jobs:
  # test-public-project: checks the link names a build of mattermost-mobile, of the lane's platform, that has not
  # expired, from a run of mobile's own code that built its head; finds the commit under test on mobile_test_branch;
  # and checks the two differ only under detox/ and .github/ and in Markdown files.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      run_id: ${{ steps.artifact.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      platform: ${{ steps.artifact.outputs.platform }}
      test_sha: ${{ steps.test-commit.outputs.sha }}
      test_branch: ${{ steps.test-commit.outputs.branch }}
      batch: ${{ steps.lane.outputs.batch }}
      server_image: ${{ steps.image.outputs.image }}
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: e2e-test-stack/scripts

      # mobile's e2e-test-setup.yml names a lane's batch dt-<ios|ipad|andr>-<type>; here the type is v2.
      - name: ci/lane
        id: lane
        env:
          LANE: ${{ inputs.lane }}
          PARALLELISM: ${{ inputs.parallelism }}
          ANDROID_RUNNER: ${{ inputs.android_runner }}
        run: |
          set -euo pipefail
          case "$LANE" in
            detox-ios) batch=dt-ios-v2 ;;
            detox-ipad) batch=dt-ipad-v2 ;;
            detox-android) batch=dt-andr-v2 ;;
            *) echo "::error::unknown lane '${LANE}'"; exit 1 ;;
          esac
          if ! [[ "$PARALLELISM" =~ ^[1-9][0-9]*$ ]] || [ "$PARALLELISM" -gt 32 ]; then
            echo "::error::parallelism must be a whole number from 1 to 32, got '${PARALLELISM}'"
            exit 1
          fi
          # Fail before create spins up servers: a runner this repository can't claim queues the
          # worker forever instead of failing, leaving its server idle until the TTL reaper takes it.
          if [ "$LANE" = detox-android ] && [ "$ANDROID_RUNNER" != ubuntu-24.04 ]; then
            echo "::error::android_runner '${ANDROID_RUNNER}' is not available to this repository; only ubuntu-24.04 is, until this repository is granted a larger runner such as ubuntu-latest-8-cores"
            exit 1
          fi
          echo "batch=${batch}" >> "$GITHUB_OUTPUT"

      - name: ci/resolve-artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.build_artifact }}
          LANE: ${{ inputs.lane }}
        run: |
          set -euo pipefail
          pattern="^https://github\.com/${MOBILE_REPOSITORY}/actions/runs/([0-9]+)/artifacts/([0-9]+)/?$"
          if ! [[ "$LINK" =~ $pattern ]]; then
            echo "::error::not a ${MOBILE_REPOSITORY} artifact link: ${LINK}"
            exit 1
          fi
          run_id=${BASH_REMATCH[1]}
          artifact_id=${BASH_REMATCH[2]}
          if ! info=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/actions/artifacts/${artifact_id}" \
            --jq '[.name, .expired, .workflow_run.id] | @tsv' 2>&1); then
            echo "::error::artifact ${artifact_id} of ${MOBILE_REPOSITORY} could not be read: ${info}"
            exit 1
          fi
          IFS=$'\t' read -r name expired artifact_run <<< "$info"
          case "$name" in
            ios-build-simulator-*) platform=ios; build_job=build-ios-simulator ;;
            android-build-files-*) platform=android; build_job=build-android-apk ;;
            *) platform="" ;;
          esac
          if [ -z "$platform" ] || [ "$artifact_run" != "$run_id" ]; then
            echo "::error::artifact ${artifact_id} is ${name} of run ${artifact_run}, not an iOS or Android build of run ${run_id}"
            exit 1
          fi
          case "$LANE" in
            detox-ios | detox-ipad) want=ios; want_name="an ios-build-simulator-*" ;;
            *) want=android; want_name="an android-build-files-*" ;;
          esac
          if [ "$platform" != "$want" ]; then
            echo "::error::${LANE} needs ${want_name} artifact; ${name} is a ${platform} build"
            exit 1
          fi
          if [ "$expired" != false ]; then
            echo "::error::artifact ${name} has expired"
            exit 1
          fi
          # download-artifact finds an artifact by id only among the newest of each name in the run.
          if ! newest=$(e2e-test-stack/scripts/gh-api.sh --paginate "repos/${MOBILE_REPOSITORY}/actions/runs/${run_id}/artifacts?name=${name}&per_page=100" \
            --jq '.artifacts[].id' 2>&1); then
            echo "::error::the artifacts of run ${run_id} of ${MOBILE_REPOSITORY} could not be read: ${newest}"
            exit 1
          fi
          newest=$(sort -n <<< "$newest" | tail -1)
          if [ "$newest" != "$artifact_id" ]; then
            echo "::error::run ${run_id} has a newer ${name} artifact, ${newest}; use https://github.com/${MOBILE_REPOSITORY}/actions/runs/${run_id}/artifacts/${newest}"
            exit 1
          fi
          if ! info=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/actions/runs/${run_id}" \
            --jq '[.head_sha, .head_branch, .name, .head_repository.full_name] | @tsv' 2>&1); then
            echo "::error::run ${run_id} of ${MOBILE_REPOSITORY} could not be read: ${info}"
            exit 1
          fi
          IFS=$'\t' read -r sha branch workflow head_repo <<< "$info"
          # The app runs in jobs that hold the repository's credentials key: only a build of mattermost-mobile's own
          # code, never a fork's pull request.
          if [ "$head_repo" != "$MOBILE_REPOSITORY" ]; then
            echo "::error::run ${run_id} built code from ${head_repo}, not ${MOBILE_REPOSITORY}; only its own branches are run"
            exit 1
          fi
          # Mobile's E2E workflow builds its MOBILE_VERSION input, which may differ from the run's head; the build job's
          # checkout step logs the commit it built. The check above holds only when it is the head.
          if ! job=$(e2e-test-stack/scripts/gh-api.sh --paginate "repos/${MOBILE_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"${build_job}\") | .id" 2>&1); then
            echo "::error::the jobs of run ${run_id} of ${MOBILE_REPOSITORY} could not be read: ${job}"
            exit 1
          fi
          job=$(head -1 <<< "$job")
          built=""
          log="${RUNNER_TEMP}/build-job.log"
          if [ -n "$job" ] && curl -fsSL --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 --retry-connrefused \
            -o "$log" -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${MOBILE_REPOSITORY}/actions/jobs/${job}/logs"; then
            built=$(grep -oE ' ref: [0-9a-f]{40}' "$log" | head -1 | awk '{print $2}')
          fi
          if [ -z "$built" ]; then
            echo "::error::the commit run ${run_id}'s ${build_job} job built could not be read from its log"
            exit 1
          fi
          if [ "$built" != "$sha" ]; then
            echo "::error::run ${run_id} built ${built}, not its head ${sha}; use a run that built its own head"
            exit 1
          fi
          {
            echo "run_id=${run_id}"
            echo "artifact_id=${artifact_id}"
            echo "sha=${sha}"
            echo "platform=${platform}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${platform} build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | [\`${name}\`](${LINK}) |"
            echo "| Run | [${workflow} ${run_id}](https://github.com/${MOBILE_REPOSITORY}/actions/runs/${run_id}) on \`${branch}\` |"
            echo "| Build commit | [\`${sha:0:12}\`](https://github.com/${MOBILE_REPOSITORY}/commit/${sha}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The tests run from a branch of mattermost-mobile itself: the branches API lists only its own, and a commit
      # by SHA must be on that branch, as the repository API also serves a fork's commits by SHA.
      - name: ci/resolve-test-commit
        id: test-commit
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ inputs.mobile_test_branch }}
          SHA: ${{ inputs.mobile_test_sha }}
        run: |
          set -euo pipefail
          if ! [[ "$BRANCH" =~ ^[A-Za-z0-9._/-]+$ ]] || [[ "$BRANCH" == *..* ]]; then
            echo "::error::mobile_test_branch must be a branch name, got '${BRANCH}'"
            exit 1
          fi
          if [ -n "$SHA" ] && ! [[ "$SHA" =~ ^[0-9a-f]{7,40}$ ]]; then
            echo "::error::mobile_test_sha must be a SHA of 7 to 40 hex characters, or empty, got '${SHA}'"
            exit 1
          fi
          if [ -n "$SHA" ] && [ "${#SHA}" -lt 40 ]; then
            if ! full=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/commits/${SHA}" --jq .sha 2>&1) \
              || ! [[ "$full" =~ ^[0-9a-f]{40}$ ]]; then
              echo "::error::${SHA} is not a commit of ${MOBILE_REPOSITORY}: ${full}"
              exit 1
            fi
            SHA=$full
          fi
          if ! head=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/branches/${BRANCH}" --jq .commit.sha 2>&1); then
            echo "::error::${BRANCH} is not a branch of ${MOBILE_REPOSITORY}: ${head}"
            exit 1
          fi
          if [ -z "$SHA" ]; then
            SHA=$head
          elif [ "$SHA" != "$head" ]; then
            if ! status=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/compare/${SHA}...${head}" --jq .status 2>&1); then
              echo "::error::${SHA} could not be compared with ${BRANCH}: ${status}"
              exit 1
            fi
            if [ "$status" != ahead ]; then
              echo "::error::${SHA} is not on ${BRANCH} of ${MOBILE_REPOSITORY} (compare status '${status}')"
              exit 1
            fi
          fi
          {
            echo "sha=${SHA}"
            echo "branch=${BRANCH}"
          } >> "$GITHUB_OUTPUT"
          echo "| Test commit | [\`${SHA:0:12}\`](https://github.com/${MOBILE_REPOSITORY}/commit/${SHA}) on \`${BRANCH}\` |" >> "$GITHUB_STEP_SUMMARY"

      # The app is built from one commit and the tests run from another, so the two may differ only in the tests, the
      # workflows and the Markdown docs, none of which the app is built from. Compare lists the files changed from the merge base to its head, so each way round covers one side;
      # together they cover every path that differs. A rename counts both its paths.
      - name: ci/check-app-files
        env:
          GH_TOKEN: ${{ github.token }}
          BUILT: ${{ steps.artifact.outputs.sha }}
          TESTED: ${{ steps.test-commit.outputs.sha }}
        run: |
          set -euo pipefail
          if [ "$BUILT" = "$TESTED" ]; then
            echo "The tests run from the build's commit"
            exit 0
          fi
          app=""
          for range in "${BUILT}...${TESTED}" "${TESTED}...${BUILT}"; do
            if ! files=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/compare/${range}" \
              --jq '.files // [] | [length, ([.[] | .filename, (.previous_filename // empty)] | unique | map(select(test("^(detox|\\.github)/|\\.md$") | not)) | join(" "))] | @tsv' 2>&1); then
              echo "::error::${range} of ${MOBILE_REPOSITORY} could not be compared: ${files}"
              exit 1
            fi
            IFS=$'\t' read -r count paths <<< "$files"
            # Compare lists at most 300 files; past that the rest are unknown.
            if [ "$count" -ge 300 ]; then
              echo "::error::${range} changes ${count} files or more, too many to check; use a build closer to the test commit"
              exit 1
            fi
            app="${app:+${app} }${paths}"
          done
          if [ -n "${app// /}" ]; then
            echo "::error::the build's commit ${BUILT} and the test commit ${TESTED} differ outside detox/, .github/ and Markdown files: ${app}"
            exit 1
          fi
          echo "${BUILT} and ${TESTED} differ only under detox/ and .github/ and in Markdown files"

      # The latest mattermost/mattermost release unless one is given.
      - name: ci/resolve-server-image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.server_image }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE" ]; then
            if ! tag=$(e2e-test-stack/scripts/gh-api.sh repos/mattermost/mattermost/releases/latest --jq .tag_name 2>&1); then
              echo "::error::the latest mattermost/mattermost release could not be read: ${tag}"
              exit 1
            fi
            IMAGE="mattermost/mattermost-enterprise-edition:${tag#v}"
          fi
          repos='(mattermost|mattermostdevelopment)/mattermost-enterprise(-fips)?-edition'
          if ! [[ "$IMAGE" =~ ^((docker\.io|index\.docker\.io)/)?${repos}:[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::the server image must be a tag of mattermost/ or mattermostdevelopment/ mattermost-enterprise-edition or mattermost-enterprise-fips-edition, e.g. mattermost/mattermost-enterprise-edition:10.11.3"
            exit 1
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "| Server image | \`${IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"

  # test-public-project: copies the app into this run once, as mobile's build jobs upload it into theirs, so every
  # worker's download by run id finds it here: the iOS simulator app, or the Android app and test APKs alone (mobile's
  # artifact holds the whole build directory, over a gigabyte).
  app:
    needs: resolve
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: ci/download-mobile-build
        id: download
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          repository: ${{ env.MOBILE_REPOSITORY }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build

      # A re-run can upload a newer artifact of the same name after resolve checked it, which hides the checked one.
      - name: ci/explain-download-failure
        if: failure() && steps.download.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ needs.resolve.outputs.run_id }}
          ARTIFACT_ID: ${{ needs.resolve.outputs.artifact_id }}
        run: |
          set -euo pipefail
          if ! name=$(gh api "repos/${MOBILE_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}" --jq .name 2>&1); then
            echo "::error::artifact ${ARTIFACT_ID} could not be read: ${name}"
            exit 1
          fi
          newest=$(gh api --paginate "repos/${MOBILE_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?name=${name}&per_page=100" \
            --jq '.artifacts[].id' | sort -n | tail -1)
          if [ -n "$newest" ] && [ "$newest" != "$ARTIFACT_ID" ]; then
            echo "::error::run ${RUN_ID} uploaded a newer ${name} artifact, ${newest}, after resolve checked ${ARTIFACT_ID}; use https://github.com/${MOBILE_REPOSITORY}/actions/runs/${RUN_ID}/artifacts/${newest}"
          else
            echo "::error::artifact ${ARTIFACT_ID} (${name}) of run ${RUN_ID} could not be downloaded"
          fi
          exit 1

      - name: ci/check-ios-app
        if: needs.resolve.outputs.platform == 'ios'
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          zip=$(find . -name 'Mattermost-simulator-*.app.zip' | head -1)
          if [ -z "$zip" ]; then
            echo "::error::the artifact holds no Mattermost-simulator-*.app.zip"
            exit 1
          fi
          # grep reads the whole listing: -q would stop at the match, and unzip's broken pipe fails the pipeline.
          if ! unzip -l "$zip" | grep '\.app/Info\.plist$' > /dev/null; then
            echo "::error::${zip} holds no .app bundle"
            exit 1
          fi
          echo "  $(basename "$zip"): $(du -h "$zip" | cut -f1)"

      - name: ci/upload-ios-app
        if: needs.resolve.outputs.platform == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-build-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/build/**/Mattermost-simulator-*.app.zip
          if-no-files-found: error
          retention-days: 14

      # Mobile's template extracts the artifact into android/app/build and runs these two.
      - name: ci/check-android-apks
        if: needs.resolve.outputs.platform == 'android'
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          for apk in outputs/apk/debug/app-debug.apk outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ ! -s "$apk" ]; then
              echo "::error::the artifact holds no ${apk}"
              find . -name '*.apk' | head -20
              exit 1
            fi
            echo "  ${apk}: $(du -h "$apk" | cut -f1)"
          done

      # Laid out as mobile's artifact (outputs/apk/... from its root), so the template's download step, which extracts
      # it into android/app/build, works unchanged.
      - name: ci/stage-android-apks
        if: needs.resolve.outputs.platform == 'android'
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/apks"
          for apk in outputs/apk/debug/app-debug.apk outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            mkdir -p "${stage}/$(dirname "$apk")"
            cp "${RUNNER_TEMP}/build/${apk}" "${stage}/${apk}"
          done

      - name: ci/upload-android-apks
        if: needs.resolve.outputs.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-build-files-${{ github.run_id }}
          path: ${{ runner.temp }}/apks/
          if-no-files-found: error
          retention-days: 14

  # As mobile's detox-ios and detox-ipad: the iPad's device and Detox configuration for detox-ipad. The lane creates
  # and runs its batch, and reports to Test System IO.
  lane-ios:
    name: Detox ${{ inputs.lane == 'detox-ipad' && 'iPad' || 'iOS' }}
    needs: [resolve, app]
    if: needs.resolve.outputs.platform == 'ios'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-mobile-v2-ios.yml
    with:
      lane: ${{ inputs.lane }}
      commit_sha: ${{ needs.resolve.outputs.test_sha }}
      branch: ${{ needs.resolve.outputs.test_branch }}
      tsio_name: mobile-v2-${{ inputs.lane }}
      specs: ${{ inputs.specs }}
      artifact_run_id: ${{ github.run_id }}
      ios_device_name: ${{ inputs.lane == 'detox-ipad' && 'iPad Pro 13-inch (M5)' || 'iPhone 17 Pro' }}
      ios_device_os_name: "iOS 26.2"
      parallelism: ${{ inputs.parallelism }}
      detox_config: ${{ inputs.lane == 'detox-ipad' && 'ios.ipad.debug' || 'ios.sim.debug' }}
      e2e_test_stack_account: ${{ inputs.account }}
      e2e_test_stack_channel: ${{ inputs.channel }}
      e2e_test_stack_server_image: ${{ needs.resolve.outputs.server_image }}
      e2e_test_stack_batch: ${{ needs.resolve.outputs.batch }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # As mobile's detox-android.
  lane-android:
    name: Detox Android
    needs: [resolve, app]
    if: needs.resolve.outputs.platform == 'android'
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-mobile-v2-android.yml
    with:
      lane: ${{ inputs.lane }}
      commit_sha: ${{ needs.resolve.outputs.test_sha }}
      branch: ${{ needs.resolve.outputs.test_branch }}
      tsio_name: mobile-v2-${{ inputs.lane }}
      specs: ${{ inputs.specs }}
      runner: ${{ inputs.android_runner }}
      artifact_run_id: ${{ github.run_id }}
      parallelism: ${{ inputs.parallelism }}
      e2e_test_stack_account: ${{ inputs.account }}
      e2e_test_stack_channel: ${{ inputs.channel }}
      e2e_test_stack_server_image: ${{ needs.resolve.outputs.server_image }}
      e2e_test_stack_batch: ${{ needs.resolve.outputs.batch }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # As mobile's results and destroy, for one lane: the lane failed or timed out, so collect every server's logs and
  # keep the batch until its TTL, so "Re-run failed jobs" uses it. A lane that failed before create leaves no batch,
  # and the logs step finds no server.
  logs:
    needs: [resolve, lane-ios, lane-android]
    if: >-
      always() && !cancelled() && needs.resolve.result == 'success'
      && (needs.lane-ios.result == 'failure' || needs.lane-android.result == 'failure'
      || needs.lane-ios.result == 'cancelled' || needs.lane-android.result == 'cancelled')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-destroy.yml
    with:
      batch: ${{ needs.resolve.outputs.batch }}
      account: ${{ inputs.account }}
      channel: ${{ inputs.channel }}
      logs_only: true
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # As mobile's destroy and cancel: the lane passed, or the run was cancelled (also during create, once its response is
  # uploaded): collect the logs of any server up, and destroy every attempt's batch.
  destroy:
    needs: [resolve, lane-ios, lane-android]
    if: >-
      always() && needs.resolve.result == 'success'
      && (cancelled() || needs.lane-ios.result == 'success' || needs.lane-android.result == 'success')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-destroy.yml
    with:
      batch: ${{ needs.resolve.outputs.batch }}
      account: ${{ inputs.account }}
      channel: ${{ inputs.channel }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}
