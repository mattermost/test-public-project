---
name: E2E Test Stack - Mobile
run-name: "Mobile E2E (${{ inputs.platform }}) · ${{ inputs.spec_files != '' && 'selected specs' || inputs.search_path }} · ${{ inputs.parallelism }} shard(s)"

# By hand only: runs mattermost-mobile's Detox suite, iOS or Android, on
# e2e-test-stack servers, to prove the switch before a mobile PR. The app is not
# built here: the run takes the build a mobile E2E run uploaded, by its artifact
# link (ios-build-simulator-* or android-build-files-*, which also picks the
# platform), and the tests run from that build's commit. Mobile's spec splitter
# makes the shards; one batch serves the run: a server per shard, shared with no
# other shard, plus the shared second and third servers the multi-server specs
# log in to. Each shard (e2e-test-stack-mobile-ios-shard.yml or
# e2e-test-stack-mobile-android-shard.yml) runs on its own server. An iOS and
# an Android run are separate runs, so never share a server. When every shard
# passes, the batch is destroyed; when one fails, its logs are collected and the batch is kept, so "Re-run failed
# jobs" re-runs the failed shards on it and then destroys it. The batch lives
# 2 hours from create, so a re-run must start well within that. A cancelled run
# destroys its batch.
#
# Jobs marked "test-public-project:" exist only to run mobile's suite here; the
# others mirror a job in mobile's E2E workflows, named in their comment.

on:
  workflow_dispatch:
    inputs:
      platform:
        description: "Suite to run; the build artifact must match it"
        required: true
        type: choice
        options: ["detox-ios", "detox-android"]
      build_artifact:
        description: "Link to an ios-build-simulator-* or android-build-files-* artifact of a mattermost-mobile run, e.g. https://github.com/mattermost/mattermost-mobile/actions/runs/<run>/artifacts/<id>"
        required: true
        type: string
      search_path:
        description: "Spec directory to run, e.g. detox/e2e/test for every spec"
        required: false
        type: string
        default: "detox/e2e/test/products/channels/smoke_test"
      spec_files:
        description: "Space-separated spec files under search_path to run instead of all of them, e.g. detox/e2e/test/products/channels/smoke_test/account.e2e.ts"
        required: false
        type: string
        default: ""
      parallelism:
        description: "Shards, each on its own server"
        required: false
        type: string
        default: "1"
      account:
        description: "AWS account whose control plane runs the batch"
        required: false
        type: choice
        options: ["prod", "dev"]
        default: "prod"
      channel:
        description: "Control plane channel"
        required: false
        type: choice
        options: ["v1", "edge"]
        default: "v1"
      server_image:
        description: "Mattermost server image on Docker Hub, by tag. Empty is the latest mattermost/mattermost release"
        required: false
        type: string
        default: ""
      upload_to_tsio:
        description: "Upload the results to Test System IO, under this repository"
        required: false
        type: boolean
        default: false
      android_runner:
        description: "Runner for the Android shards; only ubuntu-24.04 until this repository is granted a larger runner (phase C)"
        required: false
        type: string
        default: "ubuntu-24.04"

permissions:
  contents: read

env:
  MOBILE_REPOSITORY: mattermost/mattermost-mobile

jobs:
  # test-public-project: checks the link names an iOS or Android build of mattermost-mobile that has not expired, and finds its commit and
  # platform.
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      run_id: ${{ steps.artifact.outputs.run_id }}
      artifact_id: ${{ steps.artifact.outputs.artifact_id }}
      sha: ${{ steps.artifact.outputs.sha }}
      platform: ${{ steps.artifact.outputs.platform }}
      branch: ${{ steps.artifact.outputs.branch }}
      device_name: ${{ steps.artifact.outputs.device_name }}
      device_os_version: ${{ steps.artifact.outputs.device_os_version }}
      server_image: ${{ steps.image.outputs.image }}
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: e2e-test-stack/scripts

      - name: ci/resolve-artifact
        id: artifact
        env:
          GH_TOKEN: ${{ github.token }}
          LINK: ${{ inputs.build_artifact }}
          SUITE: ${{ inputs.platform }}
          ANDROID_RUNNER: ${{ inputs.android_runner }}
        run: |
          set -euo pipefail
          pattern="^https://github\.com/${MOBILE_REPOSITORY}/actions/runs/([0-9]+)/artifacts/([0-9]+)/?$"
          if ! [[ "$LINK" =~ $pattern ]]; then
            echo "::error::not a ${MOBILE_REPOSITORY} artifact link: ${LINK}"
            exit 1
          fi
          run_id=${BASH_REMATCH[1]}
          artifact_id=${BASH_REMATCH[2]}
          if ! info=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/actions/artifacts/${artifact_id}" \
            --jq '[.name, .expired, .workflow_run.id] | @tsv' 2>&1); then
            echo "::error::artifact ${artifact_id} of ${MOBILE_REPOSITORY} could not be read: ${info}"
            exit 1
          fi
          IFS=$'\t' read -r name expired artifact_run <<< "$info"
          # The device each platform's template runs on.
          case "$name" in
            ios-build-simulator-*) platform=ios; build_job=build-ios-simulator; device_name="iPhone 17 Pro"; device_os_version="iOS 26.2" ;;
            android-build-files-*) platform=android; build_job=build-android-apk; device_name="detox_pixel_8"; device_os_version="35" ;;
            *) platform="" ;;
          esac
          if [ -z "$platform" ] || [ "$artifact_run" != "$run_id" ]; then
            echo "::error::artifact ${artifact_id} is ${name} of run ${artifact_run}, not an iOS or Android build of run ${run_id}"
            exit 1
          fi
          if [ "detox-${platform}" != "$SUITE" ]; then
            case "$SUITE" in
              detox-ios) want="an ios-build-simulator-*" ;;
              *) want="an android-build-files-*" ;;
            esac
            echo "::error::${SUITE} needs ${want} artifact; ${name} is a ${platform} build"
            exit 1
          fi
          # Fail before create spins up a server: a runner this repository can't claim queues the
          # shard forever instead of failing, leaving that server idle until the TTL reaper takes it.
          if [ "$SUITE" = detox-android ]; then
            case "$ANDROID_RUNNER" in
              ubuntu-24.04) ;;
              *)
                echo "::error::android_runner '${ANDROID_RUNNER}' is not available to this repository; only ubuntu-24.04 is, until this repository is granted a larger runner such as ubuntu-latest-8-cores (phase C)"
                exit 1
                ;;
            esac
          fi
          if [ "$expired" != false ]; then
            echo "::error::artifact ${name} has expired"
            exit 1
          fi
          if ! info=$(e2e-test-stack/scripts/gh-api.sh "repos/${MOBILE_REPOSITORY}/actions/runs/${run_id}" \
            --jq '[.head_sha, .head_branch, .name, .head_repository.full_name] | @tsv' 2>&1); then
            echo "::error::run ${run_id} of ${MOBILE_REPOSITORY} could not be read: ${info}"
            exit 1
          fi
          IFS=$'\t' read -r sha branch workflow head_repo <<< "$info"
          # The shards run this commit's code in a job that holds the repository's credentials key: only code from
          # mattermost-mobile itself, never a fork's pull request.
          if [ "$head_repo" != "$MOBILE_REPOSITORY" ]; then
            echo "::error::run ${run_id} built code from ${head_repo}, not ${MOBILE_REPOSITORY}; only its own branches are run"
            exit 1
          fi
          # Mobile's E2E workflow builds its MOBILE_VERSION input, which may differ from the run's head; the build job's
          # checkout step logs the commit it built. The tests must run from that commit, and the check above holds
          # only when it is the head.
          if ! job=$(e2e-test-stack/scripts/gh-api.sh --paginate "repos/${MOBILE_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
            --jq ".jobs[] | select(.name == \"${build_job}\") | .id" 2>&1); then
            echo "::error::the jobs of run ${run_id} of ${MOBILE_REPOSITORY} could not be read: ${job}"
            exit 1
          fi
          job=$(head -1 <<< "$job")
          built=""
          log="${RUNNER_TEMP}/build-job.log"
          if [ -n "$job" ] && curl -fsSL --connect-timeout 30 --max-time 300 --retry 3 --retry-delay 10 --retry-connrefused \
            -o "$log" -H "Authorization: Bearer ${GH_TOKEN}" \
            "https://api.github.com/repos/${MOBILE_REPOSITORY}/actions/jobs/${job}/logs"; then
            built=$(grep -oE ' ref: [0-9a-f]{40}' "$log" | head -1 | awk '{print $2}')
          fi
          if [ -z "$built" ]; then
            echo "::error::the commit run ${run_id}'s ${build_job} job built could not be read from its log"
            exit 1
          fi
          if [ "$built" != "$sha" ]; then
            echo "::error::run ${run_id} built ${built}, not its head ${sha}; use a run that built its own head"
            exit 1
          fi
          {
            echo "run_id=${run_id}"
            echo "artifact_id=${artifact_id}"
            echo "sha=${sha}"
            echo "platform=${platform}"
            echo "branch=${branch}"
            echo "device_name=${device_name}"
            echo "device_os_version=${device_os_version}"
          } >> "$GITHUB_OUTPUT"
          {
            echo "### ${platform} build"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Artifact | [\`${name}\`](${LINK}) |"
            echo "| Run | [${workflow} ${run_id}](https://github.com/${MOBILE_REPOSITORY}/actions/runs/${run_id}) on \`${branch}\` |"
            echo "| Commit | [\`${sha:0:12}\`](https://github.com/${MOBILE_REPOSITORY}/commit/${sha}) |"
          } >> "$GITHUB_STEP_SUMMARY"

      # The latest mattermost/mattermost release unless one is given, as Matterwick picks for mobile.
      - name: ci/resolve-server-image
        id: image
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ inputs.server_image }}
        run: |
          set -euo pipefail
          if [ -z "$IMAGE" ]; then
            if ! tag=$(e2e-test-stack/scripts/gh-api.sh repos/mattermost/mattermost/releases/latest --jq .tag_name 2>&1); then
              echo "::error::the latest mattermost/mattermost release could not be read: ${tag}"
              exit 1
            fi
            IMAGE="mattermost/mattermost-enterprise-edition:${tag#v}"
          fi
          echo "image=${IMAGE}" >> "$GITHUB_OUTPUT"
          echo "| Server image | \`${IMAGE}\` |" >> "$GITHUB_STEP_SUMMARY"

  # test-public-project: copies the app into this run once, so every shard downloads it from here: the iOS simulator app, or the Android
  # app and test APKs alone (mobile's artifact holds the whole build directory, over a gigabyte).
  app:
    needs: resolve
    runs-on: ubuntu-24.04
    steps:
      - name: ci/download-mobile-build
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          artifact-ids: ${{ needs.resolve.outputs.artifact_id }}
          repository: ${{ env.MOBILE_REPOSITORY }}
          run-id: ${{ needs.resolve.outputs.run_id }}
          github-token: ${{ github.token }}
          path: ${{ runner.temp }}/build

      - name: ci/check-ios-app
        if: needs.resolve.outputs.platform == 'ios'
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          zip=$(find . -name 'Mattermost-simulator-*.app.zip' | head -1)
          if [ -z "$zip" ]; then
            echo "::error::the artifact holds no Mattermost-simulator-*.app.zip"
            exit 1
          fi
          # grep reads the whole listing: -q would stop at the match, and unzip's broken pipe fails the pipeline.
          if ! unzip -l "$zip" | grep '\.app/Info\.plist$' > /dev/null; then
            echo "::error::${zip} holds no .app bundle"
            exit 1
          fi
          echo "  $(basename "$zip"): $(du -h "$zip" | cut -f1)"

      - name: ci/upload-ios-app
        if: needs.resolve.outputs.platform == 'ios'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: ios-build-simulator-${{ github.run_id }}
          path: ${{ runner.temp }}/build/**/Mattermost-simulator-*.app.zip
          if-no-files-found: error
          retention-days: 14

      # Mobile's template extracts the artifact into android/app/build and runs these two.
      - name: ci/check-android-apks
        if: needs.resolve.outputs.platform == 'android'
        working-directory: ${{ runner.temp }}/build
        run: |
          set -euo pipefail
          for apk in outputs/apk/debug/app-debug.apk outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            if [ ! -s "$apk" ]; then
              echo "::error::the artifact holds no ${apk}"
              find . -name '*.apk' | head -20
              exit 1
            fi
            echo "  ${apk}: $(du -h "$apk" | cut -f1)"
          done

      # Laid out as mobile's artifact (outputs/apk/... from its root), so the shard's copy of mobile's download step,
      # which extracts it into android/app/build, works unchanged.
      - name: ci/stage-android-apks
        if: needs.resolve.outputs.platform == 'android'
        run: |
          set -euo pipefail
          stage="${RUNNER_TEMP}/apks"
          for apk in outputs/apk/debug/app-debug.apk outputs/apk/androidTest/debug/app-debug-androidTest.apk; do
            mkdir -p "${stage}/$(dirname "$apk")"
            cp "${RUNNER_TEMP}/build/${apk}" "${stage}/${apk}"
          done

      - name: ci/upload-android-apks
        if: needs.resolve.outputs.platform == 'android'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: android-build-files-${{ github.run_id }}
          path: ${{ runner.temp }}/apks/
          if-no-files-found: error
          retention-days: 14

  # As mobile's generate-specs: mobile's spec splitter. Mutation specs go to target B only, a shard with its own
  # server like every other.
  generate-specs:
    needs: resolve
    runs-on: ubuntu-24.04
    outputs:
      specs: ${{ steps.generate-specs.outputs.specs }}
      results_id: ${{ steps.results-id.outputs.id }}
    steps:
      - name: ci/checkout-mobile
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: ci/results-id
        id: results-id
        run: echo "id=$(tr -dc a-z0-9 < /dev/urandom | head -c 10)" >> "$GITHUB_OUTPUT"

      - name: ci/generate-specs
        id: generate-specs
        uses: ./.github/actions/generate-specs
        with:
          parallelism: ${{ inputs.parallelism }}
          search_path: ${{ inputs.search_path }}
          spec_files: ${{ inputs.spec_files }}
          device_name: ${{ needs.resolve.outputs.device_name }}
          device_os_version: ${{ needs.resolve.outputs.device_os_version }}
          platform: ${{ needs.resolve.outputs.platform }}
          mutation_targets: B

  # test-public-project: counts the servers: one per shard, plus the shared second and third when a shard's specs log in to them.
  plan:
    needs: [resolve, generate-specs]
    runs-on: ubuntu-24.04
    outputs:
      count: ${{ steps.plan.outputs.count }}
      shards: ${{ steps.plan.outputs.shards }}
      shared: ${{ steps.plan.outputs.shared }}
      services: ${{ steps.plan.outputs.services }}
      webhook: ${{ steps.plan.outputs.webhook }}
    steps:
      - name: ci/checkout-mobile-specs
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: |
            detox/e2e/test
            detox/e2e/support

      - name: ci/plan-servers
        id: plan
        env:
          SPLIT: ${{ needs.generate-specs.outputs.specs }}
        run: |
          set -euo pipefail
          # More shards than specs leaves empty ones, which would run Detox with no spec filter: drop them.
          SPECS=$(jq -c '{include: [.include[] | select((.specs // "") | test("\\S"))]}' <<< "$SPLIT")
          if [ "$(jq '.include | length' <<< "$SPECS")" -eq 0 ]; then
            echo "::error::the split holds no specs"
            exit 1
          fi
          read -ra files <<< "$(jq -r '[.include[].specs] | join(" ")' <<< "$SPECS")"
          for f in "${files[@]}"; do
            if [ ! -f "$f" ]; then
              echo "::error::spec ${f} is not in ${MOBILE_REPOSITORY} at the build's commit"
              exit 1
            fi
          done
          shared=0
          if grep -lqE 'site(Three|3)Url|server(Three|3)Url' "${files[@]}"; then
            shared=2
          elif grep -lqE 'site(Two|2)Url|server(Two|2)Url' "${files[@]}"; then
            shared=1
          fi
          # The mm_blocks specs call back to the batch's webhook sidecar, which only mobile commits that know
          # WEBHOOK_SIDECAR can use: they check it from the runner otherwise, which cannot reach it. From an older
          # commit, no sidecar is requested, and the mm_blocks specs skip the tests that need one.
          services=""
          if [[ " ${files[*]} " == *mm_blocks_* ]]; then
            if grep -rqsw 'WEBHOOK_SIDECAR' detox/e2e/support; then
              services=webhook
            else
              echo "::warning::${MOBILE_REPOSITORY} at this commit does not support WEBHOOK_SIDECAR: no webhook sidecar, so the mm_blocks specs skip the tests that need one"
            fi
          fi
          n=$(jq '.include | length' <<< "$SPECS")
          # Shard i (in split order) gets server i; the shared ones follow.
          shards=$(jq -c '{include: [.include | to_entries[] | .value + {serverIndex: (.key | tostring)}]}' <<< "$SPECS")
          {
            echo "count=$((n + shared))"
            echo "shards=${shards}"
            echo "shared=$(jq -nc --argjson n "$n" --argjson s "$shared" '[range($n; $n + $s)]')"
            echo "services=${services}"
            echo "webhook=$([ "$services" = webhook ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"
          echo "${n} shard(s), ${shared} shared server(s): $((n + shared)) in all" >> "$GITHUB_STEP_SUMMARY"

  # test-public-project: one batch for the run, in place of mobile's server creation.
  create:
    needs: [resolve, plan]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-create.yml
    with:
      # The batch's name in this run, ios or android; the shards, logs and destroy name it too.
      batch: ${{ needs.resolve.outputs.platform }}
      account: ${{ inputs.account || 'prod' }}
      channel: ${{ inputs.channel }}
      server_image: ${{ needs.resolve.outputs.server_image }}
      count: ${{ needs.plan.outputs.count }}
      ttl: 2h
      license: enterprise-advanced
      shared_admin_password: true
      # The webhook sidecar the mm_blocks specs call back to, at http://webhook:3000 inside each server; only when the
      # run has mm_blocks specs.
      services: ${{ needs.plan.outputs.services }}
      # mobile's E2E test server settings, one per line, sorted by name, with email on, which the stack leaves off. Not
      # the ConnectedWorkspacesSettings: the stack boots every server with them on from its config file, and here they
      # could not be switched through the config API, as mobile's specs do.
      server_env: |-
        {
          "MM_EMAILSETTINGS_FEEDBACKEMAIL": "test@example.com",
          "MM_EMAILSETTINGS_REPLYTOADDRESS": "test@example.com",
          "MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS": "true",
          "MM_EXPERIMENTALSETTINGS_ENABLEWATERMARK": "false",
          "MM_EXPERIMENTALSETTINGS_RESTRICTSYSTEMADMIN": "false",
          "MM_FEATUREFLAGS_CHANNELBOOKMARKS": "true",
          "MM_FEATUREFLAGS_CUSTOMPROFILEATTRIBUTES": "true",
          "MM_FEATUREFLAGS_INTERACTIVEDIALOGAPPSFORM": "true",
          "MM_FEATUREFLAGS_MMBLOCKSENABLED": "true",
          "MM_FILESETTINGS_ENABLEPUBLICLINK": "true",
          "MM_PASSWORDSETTINGS_MINIMUMLENGTH": "8",
          "MM_PLUGINSETTINGS_ENABLEMARKETPLACE": "true",
          "MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE": "true",
          "MM_PLUGINSETTINGS_ENABLEUPLOADS": "true",
          "MM_RATELIMITSETTINGS_ENABLE": "true",
          "MM_RATELIMITSETTINGS_MAXBURST": "50000",
          "MM_RATELIMITSETTINGS_MEMORYSTORESIZE": "10000",
          "MM_RATELIMITSETTINGS_PERSEC": "10000",
          "MM_RATELIMITSETTINGS_VARYBYREMOTEADDR": "false",
          "MM_RATELIMITSETTINGS_VARYBYUSER": "false",
          "MM_SERVICEENVIRONMENT": "test",
          "MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION": "true",
          "MM_SERVICESETTINGS_ENABLECHANNELBOOKMARKS": "true",
          "MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW": "false",
          "MM_SERVICESETTINGS_ENABLETUTORIAL": "false",
          "MM_SERVICESETTINGS_ENABLEUSERTYPINGMESSAGES": "false",
          "MM_SERVICESETTINGS_MAXIMUMACTIVEUSERS": "999999",
          "MM_SERVICESETTINGS_MAXIMUMLOGINATTEMPTS": "999999",
          "MM_SERVICESETTINGS_SESSIONCACHEINMINUTES": "180",
          "MM_SERVICESETTINGS_SESSIONLENGTHMOBILEINHOURS": "5000",
          "MM_SERVICESETTINGS_SESSIONLENGTHWEBINHOURS": "4320",
          "MM_SUPPORTSETTINGS_HELPLINK": "https://docs.mattermost.com/",
          "MM_SUPPORTSETTINGS_REPORTAPROBLEMTYPE": "default",
          "MM_TEAMSETTINGS_EXPERIMENTALENABLEAUTOMATICREPLIES": "true",
          "MM_TEAMSETTINGS_MAXUSERSPERTEAM": "999999"
        }
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # As mobile's provision-servers: the shared servers, provisioned once, without the demo plugin, as mobile's shared server is.
  provision-shared:
    needs: [resolve, plan, create]
    if: needs.plan.outputs.shared != '[]'
    runs-on: ubuntu-24.04
    # actions: read for the open action, which reads this run's artifacts.
    permissions:
      actions: read
      contents: read
    outputs:
      site_2_url: ${{ steps.urls.outputs.site_2_url }}
      site_3_url: ${{ steps.urls.outputs.site_3_url }}
    steps:
      - name: ci/checkout-mobile
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false

      - name: ci/setup-node-for-stack
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: ci/open-shared
        id: server
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-stack/open@d6488ead2b451fe6f6ecf687c4d46467b896b514  # main
        with:
          caller-key: test-public-project
          batch: ${{ needs.resolve.outputs.platform }}
          index: ${{ fromJSON(needs.plan.outputs.shared)[0] }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

      - name: ci/shared-urls
        id: urls
        env:
          SITES: ${{ needs.create.outputs.sites }}
          SHARED: ${{ needs.plan.outputs.shared }}
          ADMIN_USERNAME_VALUE: ${{ steps.server.outputs.admin-username }}
          ADMIN_PASSWORD_VALUE: ${{ steps.server.outputs.admin-password }}
        run: |
          set -euo pipefail
          site2=$(jq -r --argjson s "$SHARED" '.[$s[0]] // ""' <<< "$SITES")
          site3=$(jq -r --argjson s "$SHARED" 'if ($s | length) > 1 then .[$s[1]] else "" end' <<< "$SITES")
          {
            echo "site_2_url=${site2}"
            echo "site_3_url=${site3}"
            echo "list<<EOF"
            printf '%s\n' "$site2" "$site3" | sed '/^$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          {
            echo "ADMIN_USERNAME=$ADMIN_USERNAME_VALUE"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD_VALUE"
          } >> "$GITHUB_ENV"

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      # This repository's copy of mobile's provisioning action, beside mobile's checkout at the workspace root.
      - name: ci/checkout-provision-action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .e2e-test-stack
          persist-credentials: false
          sparse-checkout: .github/actions/e2e-test-stack-mobile-provision

      - name: ci/provision-shared
        uses: ./.e2e-test-stack/.github/actions/e2e-test-stack-mobile-provision
        with:
          server-urls: ${{ steps.urls.outputs.list }}

  # As mobile's e2e-ios / e2e-android: one of these runs, for the build's platform. A job that calls a reusable workflow names it literally.
  shard-ios:
    needs: [resolve, app, generate-specs, plan, create, provision-shared]
    if: >-
      always() && needs.resolve.outputs.platform == 'ios' && needs.app.result == 'success' && needs.create.result == 'success'
      && (needs.provision-shared.result == 'success' || needs.provision-shared.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: shard ${{ matrix.runId }}
    # actions: read for the shards' download of this run's app by run id, and their open action.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-test-stack-mobile-ios-shard.yml
    with:
      batch: ${{ needs.resolve.outputs.platform }}
      mobile_sha: ${{ needs.resolve.outputs.sha }}
      run_id: ${{ matrix.runId }}
      server_index: ${{ matrix.serverIndex }}
      site_2_url: ${{ needs.provision-shared.outputs.site_2_url }}
      site_3_url: ${{ needs.provision-shared.outputs.site_3_url }}
      specs: ${{ matrix.specs }}
      webhook: ${{ needs.plan.outputs.webhook == 'true' }}
      role: ${{ matrix.role }}
      device_name: ${{ matrix.deviceName }}
      device_os_version: ${{ matrix.deviceOsVersion }}
      results_id: ${{ needs.generate-specs.outputs.results_id }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  shard-android:
    needs: [resolve, app, generate-specs, plan, create, provision-shared]
    if: >-
      always() && needs.resolve.outputs.platform == 'android' && needs.app.result == 'success' && needs.create.result == 'success'
      && (needs.provision-shared.result == 'success' || needs.provision-shared.result == 'skipped')
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.shards) }}
    name: shard ${{ matrix.runId }}
    # actions: read for the shards' download of this run's app by run id, and their open action.
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/e2e-test-stack-mobile-android-shard.yml
    with:
      batch: ${{ needs.resolve.outputs.platform }}
      mobile_sha: ${{ needs.resolve.outputs.sha }}
      run_id: ${{ matrix.runId }}
      server_index: ${{ matrix.serverIndex }}
      site_2_url: ${{ needs.provision-shared.outputs.site_2_url }}
      site_3_url: ${{ needs.provision-shared.outputs.site_3_url }}
      specs: ${{ matrix.specs }}
      webhook: ${{ needs.plan.outputs.webhook == 'true' }}
      role: ${{ matrix.role }}
      android_avd_name: ${{ matrix.deviceName }}
      android_api_level: ${{ matrix.deviceOsVersion }}
      results_id: ${{ needs.generate-specs.outputs.results_id }}
      runner: ${{ inputs.android_runner }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # test-public-project: a shard failed or timed out: collect every server's logs and keep the batch, so a re-run of
  # the failed shards uses it.
  logs:
    needs: [resolve, plan, create, shard-ios, shard-android]
    if: >-
      always() && needs.create.result == 'success'
      && !cancelled()
      && (needs.shard-ios.result == 'failure' || needs.shard-android.result == 'failure'
      || needs.shard-ios.result == 'cancelled' || needs.shard-android.result == 'cancelled')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-destroy.yml
    with:
      batch: ${{ needs.resolve.outputs.platform }}
      account: ${{ inputs.account || 'prod' }}
      channel: ${{ inputs.channel }}
      logs_only: true
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # test-public-project: every shard passed, the run was cancelled (also during create, once its response is
  # uploaded), or the create failed partway: collect the logs of any server up, and destroy every attempt's batch.
  destroy:
    needs: [resolve, plan, create, shard-ios, shard-android]
    if: >-
      always() && needs.create.result != 'skipped'
      && (cancelled()
      || needs.shard-ios.result == 'success' || needs.shard-android.result == 'success'
      || (needs.shard-ios.result == 'skipped' && needs.shard-android.result == 'skipped')
      || needs.create.result == 'failure' || needs.create.result == 'cancelled')
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-destroy.yml
    with:
      batch: ${{ needs.resolve.outputs.platform }}
      account: ${{ inputs.account || 'prod' }}
      channel: ${{ inputs.channel }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  # test-public-project: each shard's Jest results, counted, in place of mobile's report job.
  report:
    needs: [resolve, generate-specs, plan, shard-ios, shard-android]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    # actions: read to name the one artifact download-artifact extracts into the path itself.
    permissions:
      actions: read
      contents: read
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false
          sparse-checkout: e2e-test-stack/scripts

      - name: ci/download-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: ${{ needs.resolve.outputs.platform }}-results-${{ needs.generate-specs.outputs.results_id }}-*
          path: ${{ runner.temp }}/results

      - name: ci/summary
        env:
          SPECS: ${{ needs.plan.outputs.shards }}
          RESULTS: ${{ runner.temp }}/results
          RESULTS_ID: ${{ needs.generate-specs.outputs.results_id }}
          PLATFORM: ${{ needs.resolve.outputs.platform }}
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          # download-artifact extracts into the path itself, not a folder named for it, when exactly one artifact
          # matches: name that artifact's shard, so its file is not taken for another's.
          root_id=""
          if [ -f "${RESULTS}/jest-results.json" ]; then
            if ! names=$(e2e-test-stack/scripts/gh-api.sh --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
              --jq ".artifacts[].name | select(startswith(\"${PLATFORM}-results-${RESULTS_ID}-\"))" 2>&1); then
              echo "::warning::this run's artifacts could not be listed: ${names}"
              # Without the listing, the results are the one planned shard's that has no folder of its own, if
              # exactly one has none.
              names=$(for id in $(jq -r '.include[].runId' <<< "$SPECS"); do
                [ -d "${RESULTS}/${PLATFORM}-results-${RESULTS_ID}-${id}" ] || echo "${PLATFORM}-results-${RESULTS_ID}-${id}"
              done)
            fi
            if [ "$(grep -c . <<< "$names")" -eq 1 ]; then
              root_id=${names##*-}
            fi
          fi
          {
            echo "### ${PLATFORM} results"
            echo
            echo "| Shard | Role | Specs | Passed | Failed | Pending |"
            echo "|---|---|---|---|---|---|"
          } >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for id in $(jq -r '.include[].runId' <<< "$SPECS"); do
            role=$(jq -r --arg id "$id" '.include[] | select(.runId == $id) | .role' <<< "$SPECS")
            n=$(jq -r --arg id "$id" '.include[] | select(.runId == $id) | .specs | split(" ") | length' <<< "$SPECS")
            file="${RESULTS}/${PLATFORM}-results-${RESULTS_ID}-${id}/jest-results.json"
            if [ ! -f "$file" ] && [ "$id" = "$root_id" ]; then
              file="${RESULTS}/jest-results.json"
            fi
            if [ -f "$file" ]; then
              # Counted from the test records: a merged retry report may leave out the totals.
              read -r p f q ok < <(jq -r '[.testResults[]?.assertionResults[]?.status] as $s
                | [($s | map(select(. == "passed")) | length), ($s | map(select(. == "failed")) | length),
                   ($s | map(select(. == "pending" or . == "skipped" or . == "todo")) | length),
                   (if .success == false or (.numFailedTestSuites // 0) > 0 then "no" else "yes" end)] | @tsv' "$file")
              [ "$ok" = yes ] || failed=1
            else
              p="-"; f="no results"; q="-"; failed=1
            fi
            [ "$f" != 0 ] && failed=1
            echo "| ${id} | ${role} | ${n} | ${p} | ${f} | ${q} |" >> "$GITHUB_STEP_SUMMARY"
          done
          exit "$failed"

  # As mobile's report job's TSIO steps, by hand: the run's results merged and uploaded as mobile's report job does, with mobile's scripts
  # and TSIO's action, under this repository and the name mobile-e2e-test-stack, apart from mobile's own reports.
  tsio:
    needs: [resolve, generate-specs, plan, shard-ios, shard-android]
    if: always() && inputs.upload_to_tsio && needs.plan.result == 'success'
    runs-on: ubuntu-24.04
    # id-token: write for TSIO's OIDC; actions: read for its job lookup and the results download.
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: ci/checkout-mobile-utils
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ needs.resolve.outputs.sha }}
          persist-credentials: false
          sparse-checkout: detox/utils

      - name: ci/download-results
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        continue-on-error: true
        with:
          pattern: ${{ needs.resolve.outputs.platform }}-results-${{ needs.generate-specs.outputs.results_id }}-*
          path: detox/artifacts/

      # As mobile's report job: TSIO reads testFilePath and nested testResults, which the merge writes.
      - name: ci/merge-results
        env:
          EXPECTED_SPECS: ${{ needs.plan.outputs.shards }}
        run: |
          set -euo pipefail
          if ! node detox/utils/merge-jest-results-for-tsio.js \
            --dir detox/artifacts \
            --repo-root "${GITHUB_WORKSPACE}" \
            --expected-specs "$EXPECTED_SPECS" \
            --output detox/artifacts/jest-results-merged.json; then
            echo "::warning::no results to merge; uploading a failure stub"
            node detox/utils/write-tsio-failure-stub.mjs \
              --format jest \
              --output detox/artifacts/jest-results-merged.json \
              --job-name tsio \
              --reason "No shard wrote jest-results.json"
          fi

      - name: ci/tsio-identity
        id: identity
        env:
          JOB_KEY: ${{ inputs.platform }}
          SHA: ${{ needs.resolve.outputs.sha }}
          BRANCH: ${{ needs.resolve.outputs.branch }}
        run: |
          set -euo pipefail
          BASE=$(jq -nc --arg repo "$GITHUB_REPOSITORY" --arg sha "$SHA" --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" --arg branch "$BRANCH" \
            '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, gh_run_attempt:$attempt, branch:$branch,
              name:"mobile-e2e-test-stack", run_group:"mobile-e2e-test-stack", framework:"detox"}')
          export BASE
          config=$(node -e '
            const {buildTsioJobConfig} = require("./detox/utils/build-tsio-job-config.js");
            process.stdout.write(JSON.stringify(buildTsioJobConfig(JSON.parse(process.env.BASE), process.env.JOB_KEY)));
          ')
          {
            echo "config<<EOF"
            echo "$config"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          echo "TSIO report: $(jq -r '.composite_identity.name' <<< "$config")"

      - name: ci/upload-to-tsio
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-report-upload@3212731263d782a3993dbdf4c8c54f143e69a7b2  # release-0.16.0
        with:
          composite-identity: ${{ toJSON(fromJSON(steps.identity.outputs.config).composite_identity) }}
          total-reports-expected: ${{ fromJSON(steps.identity.outputs.config).total_reports_expected }}
          framework: detox
          github-token: ${{ github.token }}
          gh-job-name: tsio
          json-path: detox/artifacts/jest-results-merged.json
          screenshots-dir: detox/artifacts/
