---
name: E2E Test Stack - Check

# Formatting, lint and types for the suite in e2e-test-stack/, and YAML lint for its
# workflows. Needs no AWS.

on:
  pull_request:
    paths:
      - e2e-test-stack/**
      - .github/workflows/e2e-test-stack-*.yml
      - .yamllint
  push:
    branches: [master]
    paths:
      - e2e-test-stack/**
      - .github/workflows/e2e-test-stack-*.yml
      - .yamllint

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: e2e-test-stack
    steps:
      - name: ci/checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          cache: npm
          cache-dependency-path: e2e-test-stack/package-lock.json

      - name: ci/install
        run: npm ci

      - name: ci/fmt
        run: npm run fmt:check

      - name: ci/lint
        run: npm run lint

      - name: ci/tsc
        run: npm run tsc

      # yamllint ships with the ubuntu-24.04 runner image; the rules are in .yamllint.
      - name: ci/yamllint
        working-directory: .
        run: yamllint .github/workflows/e2e-test-stack-*.yml
