---
name: E2E Test Stack - Mobile Android Shard

# One Android shard of E2E Test Stack - Mobile: runs the shard's specs on its own
# server of the run's batch (server_index), shared with no other shard, with the
# run's shared second and third servers for the specs that log in to them. The
# caller creates and destroys the batch.
#
# The test job is mattermost-mobile's .github/workflows/e2e-android-template.yml
# e2e-android job, copied as is but for the lines marked "test-public-project:".
# matrix values are this workflow's inputs, as a called workflow has no matrix.

on:
  workflow_call:
    inputs:
      batch:
        description: "The run's batch, as create was given it"
        type: string
        required: true
      mobile_sha:
        description: "mattermost/mattermost-mobile commit the app was built from"
        type: string
        required: true
      run_id:
        description: "The shard's runId from the spec split"
        type: string
        required: true
      server_index:
        description: "The shard's own server in the batch"
        type: string
        required: true
      site_2_url:
        description: "The run's shared second server; empty when no spec needs one"
        type: string
        default: ""
      site_3_url:
        description: "The run's shared third server; empty when no spec needs one"
        type: string
        default: ""
      specs:
        description: "The shard's space-separated spec files"
        type: string
        required: true
      role:
        description: "pool or mutation"
        type: string
        required: true
      android_avd_name:
        description: "As mobile's template"
        type: string
        default: "detox_pixel_8"
      android_api_level:
        description: "As mobile's template"
        type: string
        default: "35"
      max_attempts:
        description: "As mobile's template"
        type: string
        default: "2"
      tsio-shard-name:
        description: "As mobile's template; empty here, so its TSIO steps are skipped"
        type: string
        default: ""
      results_id:
        description: "Separates this run's result artifacts"
        type: string
        required: true
      runner:
        description: "Runner for the test job"
        type: string
        default: "ubuntu-24.04"
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY:
        description: "The repository's credentials key, which opens the batch's sealed server credentials"
        required: true

# actions: read for the download of this run's app by run id, and for the open action.
permissions:
  actions: read
  contents: read

env:
  MOBILE_REPOSITORY: mattermost/mattermost-mobile

jobs:
  test:
    name: ${{ inputs.role == 'mutation' && 'mutation-' || '' }}machine-${{ inputs.run_id }}-api-${{ inputs.android_api_level }}
    # test-public-project: mobile runs this on ubuntu-latest-8-cores; the caller picks (ubuntu-24.04 by default).
    runs-on: ${{ inputs.runner }}
    # test-public-project: not continue-on-error as in mobile, so a failed shard fails this job (see the last step).
    timeout-minutes: 150
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      # test-public-project: mobile's template sets these at its top; ADMIN_* and SITE_* come from the open step.
      IOS: "false"
      RUNNING_E2E: "true"
      HEADLESS: "true"
      DEVICE_NAME: ${{ inputs.android_avd_name }}
      DEVICE_OS_VERSION: ${{ inputs.android_api_level }}
      AVD_NAME: ${{ inputs.android_avd_name }}
      SDK_VERSION: ${{ inputs.android_api_level }}
      ARTIFACT_RUN_ID: ${{ github.run_id }}
      ZEPHYR_ENABLE: "false"
      TYPE: "PR"
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # test-public-project: mattermost-mobile at the build's commit, from this repository.
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ inputs.mobile_sha }}
          persist-credentials: false

      # test-public-project: the shard's own server and the run's shared ones, from the stack, in place of mobile's
      # "Assign test sites by shard role".
      # The action runs on Node 26; prepare-node-deps below switches to mobile's own version.
      - name: ci/setup-node-for-stack
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "26"
          package-manager-cache: false

      - name: ci/open-servers
        id: server
        uses: mattermost/mattermost-test-automation-toolkit/actions/e2e-test-stack/open@e2e-test-stack-split/logs  # toolkit #25-#30; main once they merge
        with:
          caller-key: test-public-project
          batch: ${{ inputs.batch }}
          index: ${{ inputs.server_index }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

      # The shard's own server, and the run's shared second and third. One admin password across the batch, as the
      # specs expect one ADMIN_* set.
      - name: Assign test sites
        env:
          ROLE: ${{ inputs.role }}
          SITE_URL: ${{ steps.server.outputs.site-url }}
          SITE_2: ${{ inputs.site_2_url }}
          SITE_3: ${{ inputs.site_3_url }}
          INSTANCES: ${{ steps.server.outputs.instances }}
          ADMIN_USERNAME_VALUE: ${{ steps.server.outputs.admin-username }}
          ADMIN_PASSWORD_VALUE: ${{ steps.server.outputs.admin-password }}
        run: |
          set -euo pipefail
          case "$ROLE" in
            pool) GUARD=enforce ;;
            mutation) GUARD=off ;;
            *) echo "::error::Unknown shard role '$ROLE'"; exit 1 ;;
          esac
          site2="$SITE_2"
          site3="$SITE_3"
          email=$(jq -r --argjson i "${{ inputs.server_index }}" '.[$i].admin_email // ""' <<< "$INSTANCES")
          {
            echo "SITE_1_URL=$SITE_URL"
            echo "SITE_2_URL=$site2"
            echo "SITE_3_URL=$site3"
            echo "ADMIN_USERNAME=$ADMIN_USERNAME_VALUE"
            echo "ADMIN_PASSWORD=$ADMIN_PASSWORD_VALUE"
            echo "ADMIN_EMAIL=$email"
            echo "E2E_SERVER_ROLE=$ROLE"
            echo "E2E_POOL_GUARD=$GUARD"
          } >> "$GITHUB_ENV"
          echo "role=$ROLE: SITE_1=$SITE_URL SITE_2=${site2:-unset} SITE_3=${site3:-unset} pool_guard=$GUARD"

      # Only libpulse0 is a real dependency here — the Android emulator needs it for
      # audio. xvfb is already in the runner image (apt reports "already the newest
      # version"), and it is listed only so a future image change fails loudly.
      - name: Install Dependencies
        timeout-minutes: 6
        run: |
          APT_OPTS=(-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o DPkg::Lock::Timeout=120)
          PACKAGES=(libpulse0 xvfb)
          sudo apt-get "${APT_OPTS[@]}" install -y "${PACKAGES[@]}" || {
            sudo apt-get "${APT_OPTS[@]}" update
            sudo apt-get "${APT_OPTS[@]}" install -y "${PACKAGES[@]}"
          }

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      # test-public-project: this repository's copy of mobile's provisioning action, adapted to the stack, beside
      # mobile's checkout at the workspace root.
      - name: ci/checkout-provision-action
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          ref: ${{ github.sha }}
          path: .e2e-test-stack
          persist-credentials: false
          sparse-checkout: .github/actions/e2e-test-stack-mobile-provision

      - name: Provision test servers
        uses: ./.e2e-test-stack/.github/actions/e2e-test-stack-mobile-provision
        with:
          server-urls: ${{ env.SITE_1_URL }}
          demo-plugin-server-urls: ${{ env.SITE_1_URL }}



      - name: Cache detox node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: detox/node_modules
          key: ${{ runner.os }}-detox-deps-${{ hashFiles('detox/package-lock.json') }}
          restore-keys: ${{ runner.os }}-detox-deps-

      - name: Install Detox Dependencies
        run: |
          cd detox
          npm install

      - name: Set .env with RUNNING_E2E=true
        run: |
          cat > .env <<EOF
          RUNNING_E2E=true
          EOF
  
      # Must precede the download: download-artifact consumes ARTIFACT_RUN_ID and
      # fails with an opaque API error when it is empty.
      - name: Verify artifact_run_id was passed by the parent workflow
        env:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}
        run: |
          if [ -z "${ARTIFACT_RUN_ID}" ]; then
            echo "❌ ARTIFACT_RUN_ID is empty — parent workflow must pass artifact_run_id from build-android-apk"
            exit 1
          fi

      - name: Download Detox Android build from parent workflow
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: android-build-files-${{ env.ARTIFACT_RUN_ID }}
          repository: ${{ github.repository }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: android/app/build

      - name: Verify Detox Android app from parent build
        run: |
          APP_APK="android/app/build/outputs/apk/debug/app-debug.apk"
          TEST_APK="android/app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk"
          if [ ! -f "$APP_APK" ]; then
            echo "❌ Missing ${APP_APK} from android-build-files-${ARTIFACT_RUN_ID}"
            find android/app/build -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          if [ ! -f "$TEST_APK" ]; then
            echo "❌ Missing ${TEST_APK} from android-build-files-${ARTIFACT_RUN_ID}"
            find android/app/build -name '*.apk' 2>/dev/null || true
            exit 1
          fi
          echo "✅ Detox will use Android APKs from parent workflow run ${ARTIFACT_RUN_ID}:"
          ls -lh "$APP_APK" "$TEST_APK"
        env:
          ARTIFACT_RUN_ID: ${{ env.ARTIFACT_RUN_ID }}

      - name: Set up Android SDK
        run: |
          export ANDROID_HOME=/usr/local/lib/android/sdk
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/emulator:$ANDROID_HOME/tools/bin:$ANDROID_HOME/platform-tools:$PATH
          echo "ANDROID_HOME=$ANDROID_HOME" >> $GITHUB_ENV
          echo "PATH=$PATH" >> $GITHUB_ENV

      - name: Start Xvfb
        run: |
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99
          echo "DISPLAY=:99" >> $GITHUB_ENV

      - name: Accept Android licenses
        run: |
          mkdir -p ~/.android
          yes | sdkmanager --licenses > sdk_licenses_output.txt || true
      
          # Check if "All SDK package licenses accepted" appears in output
          if grep -q "All SDK package licenses accepted" sdk_licenses_output.txt; then
            echo "✅ All licenses accepted successfully."
          else
            echo "❌ Licenses not fully accepted."
            cat sdk_licenses_output.txt
            exit 1
          fi

      # Cache SDK under the workspace (not /usr/local) — tar restore into system
      # SDK dirs often fails with exit code 2 when paths already exist on the image.
      - name: Cache Android SDK components
        id: android-sdk-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: .android-sdk-cache
          key: android-sdk-${{ inputs.android_api_level }}-google-apis-x86_64-v2

      - name: Apply cached Android SDK components
        if: steps.android-sdk-cache.outputs.cache-hit == 'true'
        env:
          API_LEVEL: ${{ inputs.android_api_level }}
        run: |
          for component in platform-tools emulator; do
            if [ -d ".android-sdk-cache/${component}" ]; then
              rm -rf "${ANDROID_HOME:?}/${component}"
              cp -a ".android-sdk-cache/${component}" "${ANDROID_HOME}/"
            fi
          done
          if [ -d ".android-sdk-cache/platforms/android-${API_LEVEL}" ]; then
            rm -rf "${ANDROID_HOME}/platforms/android-${API_LEVEL}"
            mkdir -p "${ANDROID_HOME}/platforms"
            cp -a ".android-sdk-cache/platforms/android-${API_LEVEL}" "${ANDROID_HOME}/platforms/"
          fi
          if [ -d ".android-sdk-cache/system-images/android-${API_LEVEL}" ]; then
            rm -rf "${ANDROID_HOME}/system-images/android-${API_LEVEL}"
            mkdir -p "${ANDROID_HOME}/system-images"
            cp -a ".android-sdk-cache/system-images/android-${API_LEVEL}" "${ANDROID_HOME}/system-images/"
          fi

      - name: Install Android SDK components
        if: steps.android-sdk-cache.outputs.cache-hit != 'true'
        env:
          API_LEVEL: ${{ inputs.android_api_level }}
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
        run: |
          if ! [[ "$API_LEVEL" =~ ^[0-9]+$ ]]; then
            echo "Invalid android_api_level: $API_LEVEL"
            exit 1
          fi
          for attempt in 1 2 3; do
            echo "SDK install attempt $attempt..."
            if yes | sdkmanager --install "platform-tools" "emulator" "platforms;android-${API_LEVEL}" "system-images;android-${API_LEVEL};google_apis;x86_64"; then
              echo "SDK install succeeded on attempt $attempt"
              break
            fi
            echo "Attempt $attempt failed, retrying..."
            if [ "$attempt" = "3" ]; then
              echo "SDK install failed after 3 attempts"
              exit 1
            fi
            sleep 10
          done
          mkdir -p .android-sdk-cache/platforms .android-sdk-cache/system-images
          cp -a "${ANDROID_HOME}/platform-tools" .android-sdk-cache/
          cp -a "${ANDROID_HOME}/emulator" .android-sdk-cache/
          cp -a "${ANDROID_HOME}/platforms/android-${API_LEVEL}" .android-sdk-cache/platforms/
          cp -a "${ANDROID_HOME}/system-images/android-${API_LEVEL}" .android-sdk-cache/system-images/

      # CI AVDs live under detox/.android/avd (see create_android_emulator.sh), not ~/.android/avd.
      - name: Cache Android Emulator & AVD
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            detox/.android
            detox/${{ env.AVD_NAME }}_api_${{ inputs.android_api_level }}
          key: android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-v3
          restore-keys: |
            android-emulator-${{ runner.os }}-${{ runner.arch }}-${{ env.AVD_NAME }}-api-${{ inputs.android_api_level }}-
            android-emulator-${{ runner.os }}-${{ runner.arch }}-

      - name: Start mm_blocks webhook sidecar
        if: contains(inputs.specs, 'mm_blocks_')
        continue-on-error: true
        env:
          SITE_1_URL: ${{ env.SITE_1_URL }}
          # test-public-project: mobile's tunnel secrets are not available here; the sidecar falls back as in mobile.
          WEBHOOK_PUBLIC_BASE_URL: ""
          CLOUDFLARED_TUNNEL_TOKEN: ""
        run: bash detox/scripts/start_webhook_sidecar.sh

      - name: Create and run Android Emulator
        # test-public-project: the id, for ci/fail-on-failed-tests.
        id: detox
        env:
          MATRIX_SPECS: ${{ inputs.specs }}
          SITE_1_URL: ${{ env.SITE_1_URL }}
          SITE_2_URL: ${{ env.SITE_2_URL }}
          SITE_3_URL: ${{ env.SITE_3_URL }}
          MAX_ATTEMPTS: ${{ inputs.max_attempts }}
          ATTEMPT_TIMEOUT_MIN: "60"
        shell: bash
        # Attempt 2 retries failed/unrun files only. Cold-boots only if the emulator is dead.
        run: |
          chmod +x detox/scripts/run_android_ci_shard.sh detox/create_android_emulator.sh
          # Split on whitespace into an array, then expand quoted: an unquoted
          # $MATRIX_SPECS is also subject to pathname expansion, so a spec path
          # containing a glob character would silently become a different argument
          # list (or vanish). Matches the iOS template's read -ra handling.
          read -ra specs <<< "$MATRIX_SPECS"
          # The output is also kept for the triage evidence step below. Not a pipe
          # into tee: the shard script leaves the emulator, adb and Metro running,
          # they inherit the pipe, and tee would wait on them until the job times
          # out. Write to the file and stream it until the script exits.
          log="$RUNNER_TEMP/detox-run.log"
          : > "$log"
          detox/scripts/run_android_ci_shard.sh "$SDK_VERSION" "$AVD_NAME" "${specs[@]}" > "$log" 2>&1 &
          shard=$!
          tail -n +1 -f --pid="$shard" "$log"
          wait "$shard"
        continue-on-error: true # We want to run all the tests

      # For the E2E triage judge: for each failed test, Detox's failure screenshot,
      # the requests Detox reported the app was still waiting on, and the test's
      # own server calls that failed.
      - name: Collect triage evidence for failed tests
        if: always()
        continue-on-error: true
        working-directory: detox
        run: node utils/triage-evidence.js --results artifacts/jest-results.json --log "$RUNNER_TEMP/detox-run.log" --dir artifacts/triage-evidence --artifacts artifacts --out "artifacts/triage-evidence/evidence-${{ inputs.run_id }}.json"

      - name: Upload triage evidence
        if: always() && inputs.tsio-shard-name != '' && hashFiles('detox/artifacts/triage-evidence/*.json') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: triage-evidence-${{ inputs.tsio-shard-name }}-${{ inputs.results_id }}-${{ inputs.run_id }}
          path: detox/artifacts/triage-evidence/

      # Second attempt for the same reason as the iOS template: losing this upload to a
      # transient ETIMEDOUT reports the shard as having produced no results at all.
      - name: Upload Android Test Report
        id: upload-android-report
        if: always() && hashFiles('detox/artifacts/**') != ''
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-results-${{ inputs.results_id }}-${{ inputs.run_id }}
          path: detox/artifacts/
          # test-public-project: a re-run of this job uploads its results again.
          overwrite: true

      # Same two-retry sequence as the iOS template (see there).
      - name: Await results service
        if: |
          !cancelled() &&
          steps.upload-android-report.outcome == 'failure'
        uses: ./.github/actions/await-results-service

      - name: Upload Android Test Report (retry 1)
        id: upload-android-report-retry
        if: |
          !cancelled() &&
          steps.upload-android-report.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-results-${{ inputs.results_id }}-${{ inputs.run_id }}
          path: detox/artifacts/
          # test-public-project: a re-run of this job uploads its results again.
          overwrite: true

      - name: Await results service (retry 2)
        if: |
          !cancelled() &&
          steps.upload-android-report.outcome == 'failure' &&
          steps.upload-android-report-retry.outcome == 'failure'
        uses: ./.github/actions/await-results-service

      - name: Upload Android Test Report (retry 2)
        if: |
          !cancelled() &&
          steps.upload-android-report.outcome == 'failure' &&
          steps.upload-android-report-retry.outcome == 'failure'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: android-results-${{ inputs.results_id }}-${{ inputs.run_id }}
          path: detox/artifacts/
          overwrite: true

      # test-public-project: mobile's report job fails the run on failed tests (this job is continue-on-error
      # there); here the shard fails, after the steps above, so the run keeps its batch and this job can be re-run on it.
      - name: ci/fail-on-failed-tests
        if: steps.detox.outcome == 'failure'
        run: |
          echo "::error::Detox failed on shard ${{ inputs.run_id }}"
          exit 1
