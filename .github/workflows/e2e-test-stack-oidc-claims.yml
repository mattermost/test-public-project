---
name: E2E Test Stack - OIDC Claims

# Prints the claims this repository's jobs present to AWS, so a trust policy can
# be compared against what it will actually be given.
#
# Temporary. Delete once the trust policy is confirmed.
#
# The token is masked and never printed. Its payload is not secret - repository,
# workflow and ref are all public here - and it is what the trust policy reads.

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  claims:
    runs-on: ubuntu-24.04
    steps:
      - name: ci/print-claims
        run: |
          set -euo pipefail

          token=$(curl -sS \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=sts.amazonaws.com" \
            | jq -r '.value')
          echo "::add-mask::${token}"

          if [ -z "$token" ] || [ "$token" = "null" ]; then
            echo "::error::no id token was issued"
            exit 1
          fi

          # A JWT is three base64url segments. The middle one carries the claims,
          # which are base64url rather than base64 and padded to a multiple of 4.
          payload=$(cut -d. -f2 <<< "$token" | tr '_-' '/+')
          case $(( ${#payload} % 4 )) in
            2) payload="${payload}==" ;;
            3) payload="${payload}=" ;;
          esac

          # iss included: an enterprise with a unique issuer URL mints tokens that
          # no provider registered under the shared issuer will match, and the
          # refusal is worded identically to a condition that did not match.
          echo "$payload" | base64 -d | jq '{
            iss,
            aud,
            repository,
            repository_owner,
            workflow_ref,
            job_workflow_ref,
            ref,
            sub
          }'
