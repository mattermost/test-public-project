---
name: E2E Test Stack - Mobile v2 iOS

# Detox on e2e-test-stack, dispatched by Test System IO: one run per lane and one
# worker matrix. Each worker owns its SITE_1 and shares SITE_2 and SITE_3. The
# Detox configuration decides the specs (begin runs `detox --listTests`); specs
# tagged @server_mutation dispatch last. Maestro and the Matterwick template are
# unchanged.
#
# create and provision are the existing workflows. begin runs after provision,
# because the orchestrator idles a run out while it waits for the first lease.
# Each worker boots one simulator, then dispatch-run leases specs onto it.
#
# test-public-project: mattermost-mobile's .github/workflows/e2e-ios-template-v2.yml (17b0174df), copied as is but
# for the lines marked "test-public-project:". Called by e2e-test-stack-mobile-v2.yml, which re-uploads the app into
# this run, checks the commit under test (commit_sha, a mattermost-mobile commit) and destroys the batch. Its jobs
# check out mattermost-mobile at commit_sha, use this repository's create, provision and sites copies, and report to
# production Test System IO under this repository.

on:
  workflow_call:
    inputs:
      lane:
        description: "Pool run name: detox-ios or detox-ipad"
        type: string
        required: true
      commit_sha:
        # test-public-project: no pr_number or fork input; the caller runs only mattermost-mobile's own commits.
        description: "The mattermost-mobile commit under test, a full 40-character SHA"
        type: string
        required: true
      branch:
        description: "test-public-project: the mattermost-mobile branch of commit_sha, for the report"
        type: string
        required: true
      tsio_name:
        description: "test-public-project: the Test System IO run name, apart from mobile's own lanes"
        type: string
        required: true
      specs:
        description: "test-public-project: space-separated specs relative to detox/ to queue instead of the Detox configuration's list; empty for the list"
        type: string
        default: ""
      artifact_run_id:
        description: "Run ID of the workflow that uploaded ios-build-simulator-*"
        type: string
        default: ""
      e2e_test_stack_account:
        description: "AWS account of the control plane, prod or dev"
        type: string
        default: "prod"
      e2e_test_stack_channel:
        description: "Control plane channel, v1 or edge"
        type: string
        default: "v1"
      e2e_test_stack_server_image:
        description: "Mattermost server image: master, latest, esr, or an image by tag"
        type: string
        default: "master"
      e2e_test_stack_batch:
        description: "This lane's batch name"
        type: string
        required: true
      parallelism:
        description: "Workers, each with its own server"
        type: string
        default: "32"
      detox_config:
        description: "Detox configuration, ios.sim.debug or ios.ipad.debug"
        type: string
        default: "ios.sim.debug"
      ios_device_name:
        description: "Simulator name"
        type: string
        default: "iPhone 17 Pro"
      ios_device_os_name:
        description: "Simulator OS version"
        type: string
        default: "iOS 26.2"
    outputs:
      report-url:
        description: "Test System IO report for this lane"
        value: ${{ jobs.summary.outputs.report-url || jobs.begin.outputs.report-url }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY:
        required: true

permissions: {}

defaults:
  run:
    shell: bash

env:
  PLATFORM: ios
  IOS: "true"
  HEADLESS: "true"
  RUNNING_E2E: "true"
  DEVICE_NAME: ${{ inputs.ios_device_name }}
  DEVICE_OS_VERSION: ${{ inputs.ios_device_os_name }}
  ARTIFACT_RUN_ID: ${{ inputs.artifact_run_id || github.run_id }}
  # test-public-project: the repository every job checks out at commit_sha.
  MOBILE_REPOSITORY: mattermost/mattermost-mobile

jobs:
  prepare:
    name: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # test-public-project: no pull-requests: read, as there is no pull request to read.
    permissions:
      contents: read
    outputs:
      branch: ${{ steps.plan.outputs.branch }}
      identity: ${{ steps.plan.outputs.identity }}
      workers: ${{ steps.plan.outputs.workers }}
      stack-count: ${{ steps.plan.outputs.stack-count }}
      slices: ${{ steps.plan.outputs.slices }}
      webhook: ${{ steps.plan.outputs.webhook }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      # A server per worker, then the shared SITE_2 and SITE_3. Provisioning runs in up to 8 jobs.
      # test-public-project: the identity is this repository's, named tsio_name, with the mobile commit and branch.
      - name: ci/plan
        id: plan
        env:
          LANE: ${{ inputs.lane }}
          PARALLELISM: ${{ inputs.parallelism }}
          COMMIT_SHA: ${{ inputs.commit_sha }}
          BRANCH: ${{ inputs.branch }}
          TSIO_NAME: ${{ inputs.tsio_name }}
        run: |
          set -euo pipefail
          if ! [[ "$COMMIT_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::commit_sha must be a full 40-character SHA, got '${COMMIT_SHA}'"
            exit 1
          fi
          if ! [[ "$LANE" =~ ^[a-z0-9-]+$ ]]; then
            echo "::error::lane must be lowercase letters, digits, and hyphens"
            exit 1
          fi
          if ! [[ "$PARALLELISM" =~ ^[1-9][0-9]*$ ]]; then
            echo "::error::parallelism must be a positive integer, got '${PARALLELISM}'"
            exit 1
          fi
          if ! grep -rqE '^export function isE2eTestStack\(' detox/provision; then
            echo "::error::the code under test predates e2e-test-stack provisioning; merge main into it"
            exit 1
          fi

          branch="$BRANCH"

          identity=$(jq -nc \
            --arg repo "$GITHUB_REPOSITORY" \
            --arg sha "$COMMIT_SHA" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            --arg name "$TSIO_NAME" \
            --arg branch "$branch" \
            '{repository:$repo, commit_sha:$sha, gh_run_id:$run_id, gh_run_attempt:$attempt, name:$name, branch:$branch}')
          count=$((PARALLELISM + 2))
          webhook=false
          if find detox/e2e/test -name 'mm_blocks_*.e2e.ts' | grep -q .; then
            webhook=true
          fi
          {
            echo "branch=${branch}"
            echo "identity=${identity}"
            echo "workers=$(jq -nc --argjson n "$PARALLELISM" '[range(1; $n + 1)]')"
            echo "stack-count=${count}"
            echo "slices=$(jq -nc --argjson n "$count" '[range(0; $n)] | group_by(. % 8) | map(map(tostring) | join(","))')"
            echo "webhook=${webhook}"
          } >> "$GITHUB_OUTPUT"
          echo "${PARALLELISM} workers, ${count} servers, webhook=${webhook}"

  e2e-test-stack-create:
    name: e2e-test-stack-create
    needs: prepare
    if: needs.prepare.result == 'success'
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/e2e-test-stack-create.yml
    with:
      batch: ${{ inputs.e2e_test_stack_batch }}
      account: ${{ inputs.e2e_test_stack_account }}
      channel: ${{ inputs.e2e_test_stack_channel }}
      server_image: ${{ inputs.e2e_test_stack_server_image }}
      count: ${{ needs.prepare.outputs.stack-count }}
      services: ${{ needs.prepare.outputs.webhook == 'true' && 'webhook' || '' }}
      license: enterprise-advanced
      shared_admin_password: true
      # 4h from create: the runner queue, the job timeout, and a re-run have to finish inside it.
      ttl: 4h
      # test-public-project: mobile's create defaults, which this repository's create does not have.
      postgres: "16"
      # One setting per line, sorted by name. Not the ConnectedWorkspacesSettings: the stack boots every server with
      # them on from its config file, and here they could not be switched through the config API, as the specs do.
      server_env: |-
        {
          "MM_EMAILSETTINGS_FEEDBACKEMAIL": "test@example.com",
          "MM_EMAILSETTINGS_REPLYTOADDRESS": "test@example.com",
          "MM_EMAILSETTINGS_SENDEMAILNOTIFICATIONS": "true",
          "MM_EXPERIMENTALSETTINGS_ENABLEWATERMARK": "false",
          "MM_EXPERIMENTALSETTINGS_RESTRICTSYSTEMADMIN": "false",
          "MM_FEATUREFLAGS_CHANNELBOOKMARKS": "true",
          "MM_FEATUREFLAGS_CUSTOMPROFILEATTRIBUTES": "true",
          "MM_FEATUREFLAGS_INTERACTIVEDIALOGAPPSFORM": "true",
          "MM_FEATUREFLAGS_MMBLOCKSENABLED": "true",
          "MM_FILESETTINGS_ENABLEPUBLICLINK": "true",
          "MM_PASSWORDSETTINGS_MINIMUMLENGTH": "8",
          "MM_PLUGINSETTINGS_ENABLEMARKETPLACE": "true",
          "MM_PLUGINSETTINGS_ENABLEREMOTEMARKETPLACE": "true",
          "MM_PLUGINSETTINGS_ENABLEUPLOADS": "true",
          "MM_RATELIMITSETTINGS_ENABLE": "true",
          "MM_RATELIMITSETTINGS_MAXBURST": "50000",
          "MM_RATELIMITSETTINGS_MEMORYSTORESIZE": "10000",
          "MM_RATELIMITSETTINGS_PERSEC": "10000",
          "MM_RATELIMITSETTINGS_VARYBYREMOTEADDR": "false",
          "MM_RATELIMITSETTINGS_VARYBYUSER": "false",
          "MM_SERVICEENVIRONMENT": "test",
          "MM_SERVICESETTINGS_ENABLEBOTACCOUNTCREATION": "true",
          "MM_SERVICESETTINGS_ENABLECHANNELBOOKMARKS": "true",
          "MM_SERVICESETTINGS_ENABLEONBOARDINGFLOW": "false",
          "MM_SERVICESETTINGS_ENABLETUTORIAL": "false",
          "MM_SERVICESETTINGS_ENABLEUSERTYPINGMESSAGES": "false",
          "MM_SERVICESETTINGS_MAXIMUMACTIVEUSERS": "999999",
          "MM_SERVICESETTINGS_MAXIMUMLOGINATTEMPTS": "999999",
          "MM_SERVICESETTINGS_SESSIONCACHEINMINUTES": "180",
          "MM_SERVICESETTINGS_SESSIONLENGTHMOBILEINHOURS": "5000",
          "MM_SERVICESETTINGS_SESSIONLENGTHWEBINHOURS": "4320",
          "MM_SUPPORTSETTINGS_HELPLINK": "https://docs.mattermost.com/",
          "MM_SUPPORTSETTINGS_REPORTAPROBLEMTYPE": "default",
          "MM_TEAMSETTINGS_EXPERIMENTALENABLEAUTOMATICREPLIES": "true",
          "MM_TEAMSETTINGS_MAXUSERSPERTEAM": "999999"
        }
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  e2e-test-stack-provision:
    name: e2e-test-stack-provision
    needs: [prepare, e2e-test-stack-create]
    if: needs.e2e-test-stack-create.result == 'success'
    permissions:
      actions: read
      contents: read
    # test-public-project: this repository's copy of mobile's e2e-test-stack-provision.yml.
    uses: ./.github/workflows/e2e-test-stack-mobile-v2-provision.yml
    with:
      batch: ${{ inputs.e2e_test_stack_batch }}
      slices: ${{ needs.prepare.outputs.slices }}
      commit_sha: ${{ inputs.commit_sha }}
    secrets:
      E2E_TEST_STACK_CREDENTIALS_KEY: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

  begin:
    name: dispatch-begin
    needs: [prepare, e2e-test-stack-provision]
    if: needs.e2e-test-stack-provision.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    outputs:
      report-url: ${{ steps.begin.outputs.report-url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: ci/setup-node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # detox --listTests only reads the Detox and Jest configuration, so install scripts are skipped.
      - name: ci/install-detox-deps
        run: cd detox && npm ci --ignore-scripts

      # test-public-project: production Test System IO, not mobile's E2E_USE_STAGING_TEST_IO_URL; with specs, those
      # specs in place of the Detox configuration's list.
      - name: ci/dispatch-begin
        id: begin
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-begin@detox-spec-list # TODO: pin to SHA after mattermost-test-system-io#153 merges
        with:
          framework: detox
          use-staging: "false"
          repo-dir: ${{ github.workspace }}
          composite-identity: ${{ needs.prepare.outputs.identity }}
          total-reports-expected: ${{ inputs.parallelism }}
          retest-on-fail: "true"
          post-pending-commit-status: "false"
          duration-base-branch: ""
          idle-timeout-ms: "2700000"
          lease-timeout-ms: "1800000"
          detox-dir: detox
          detox-list-tests: ${{ inputs.specs == '' && 'true' || 'false' }}
          detox-specs: ${{ inputs.specs }}
          detox-config: ${{ inputs.detox_config }}
          detox-sort-last: "@server_mutation"

  dispatch-run:
    name: dispatch-run-${{ inputs.lane }}-${{ matrix.worker }}
    needs: [prepare, e2e-test-stack-provision, begin]
    if: >-
      !cancelled() &&
      needs.e2e-test-stack-provision.result == 'success' &&
      needs.begin.result == 'success'
    runs-on: macos-15
    timeout-minutes: 180
    permissions:
      contents: read
      actions: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        worker: ${{ fromJSON(needs.prepare.outputs.workers) }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: ${{ env.MOBILE_REPOSITORY }}
          ref: ${{ inputs.commit_sha }}
          persist-credentials: false
          fetch-depth: 1

      # test-public-project: this repository's copy of mobile's e2e-test-stack-sites, beside mobile's checkout.
      - name: ci/e2e-test-stack-actions
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          path: .e2e-test-stack-actions
          sparse-checkout: .github/actions/e2e-test-stack-mobile-sites
          persist-credentials: false

      - name: ci/e2e-test-stack-sites
        uses: ./.e2e-test-stack-actions/.github/actions/e2e-test-stack-mobile-sites
        with:
          batch: ${{ inputs.e2e_test_stack_batch }}
          shard: ${{ matrix.worker }}
          credentials-key: ${{ secrets.E2E_TEST_STACK_CREDENTIALS_KEY }}

      - name: ci/prepare-node-deps
        uses: ./.github/actions/prepare-node-deps

      - name: Cache Homebrew packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /opt/homebrew/Cellar/applesimutils
          key: ${{ runner.os }}-${{ runner.arch }}-brew-applesimutils-v1
          restore-keys: ${{ runner.os }}-${{ runner.arch }}-brew-applesimutils-

      - name: Install Homebrew Dependencies
        run: |
          brew tap wix/brew
          brew trust wix/brew
          if brew list --formula wix/brew/applesimutils &>/dev/null || brew list --formula applesimutils &>/dev/null; then
            brew link --overwrite --force wix/brew/applesimutils 2>/dev/null \
              || brew link --overwrite --force applesimutils
          else
            brew install applesimutils
            brew link --overwrite --force wix/brew/applesimutils 2>/dev/null \
              || brew link --overwrite --force applesimutils
          fi
          command -v applesimutils

      - name: Download iOS Simulator Build
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ios-build-simulator-${{ env.ARTIFACT_RUN_ID }}
          run-id: ${{ env.ARTIFACT_RUN_ID }}
          github-token: ${{ github.token }}
          path: mobile-artifacts

      - name: Unzip iOS Simulator Build
        run: |
          unzip -o mobile-artifacts/*.zip -d mobile-artifacts/
          rm -f mobile-artifacts/*.zip

      - name: Cache detox node_modules
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: detox/node_modules
          key: ${{ runner.os }}-detox-deps-${{ hashFiles('detox/package-lock.json') }}
          restore-keys: ${{ runner.os }}-detox-deps-

      - name: Install Detox Dependencies
        run: cd detox && npm i

      - name: Get Xcode Version
        id: xcode-version
        run: echo "version=$(xcodebuild -version | head -1 | sed 's/Xcode //')" >> "$GITHUB_OUTPUT"

      - name: Cache Detox Framework
        id: detox-framework-cache
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: ~/Library/Detox/ios
          key: ${{ runner.os }}-${{ runner.arch }}-detox-framework-${{ hashFiles('detox/package-lock.json') }}-xcode-${{ steps.xcode-version.outputs.version }}

      - name: Build Detox Framework Cache
        if: steps.detox-framework-cache.outputs.cache-hit != 'true'
        run: cd detox && npx detox build-framework-cache

      - name: Set .env with RUNNING_E2E=true
        run: echo "RUNNING_E2E=true" > .env

      - name: ci/e2e-test-stack-webhook
        if: needs.prepare.outputs.webhook == 'true'
        run: |
          {
            echo "WEBHOOK_BASE_URL=http://webhook:3000"
            echo "WEBHOOK_SIDECAR=e2e-test-stack"
          } >> "$GITHUB_ENV"

      - name: Boot iOS Simulator
        run: bash detox/scripts/boot_ios_simulator_ci.sh

      # Pins Detox to the booted simulator (SIMULATOR_ID), which has the app installed.
      - name: ci/detox-config
        run: cd detox && npm run detox:config-gen

      - name: Start Metro
        run: bash detox/scripts/start_metro_detached.sh

      # test-public-project: production Test System IO, as in begin.
      - name: ci/dispatch-run
        timeout-minutes: 150
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-dispatch-run@detox-spec-list # TODO: pin to SHA after mattermost-test-system-io#153 merges
        with:
          framework: detox
          use-staging: "false"
          composite-identity: ${{ needs.prepare.outputs.identity }}
          repo-dir: ${{ github.workspace }}
          artifacts-root: ${{ github.workspace }}/worker-artifacts
          github-token: ${{ github.token }}
          gh-job-name: dispatch-run-${{ inputs.lane }}-${{ matrix.worker }}
          detox-config: ${{ inputs.detox_config }}
          batch-size: "1"
          detox-max-workers: "1"

  summary:
    name: summary
    needs: [prepare, begin, dispatch-run]
    if: always() && !cancelled() && needs.begin.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      id-token: write
    outputs:
      report-url: ${{ steps.summary.outputs.report_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      # test-public-project: production Test System IO, as in begin; no pull request.
      - name: ci/run-summary
        id: summary
        uses: mattermost/mattermost-test-system-io/.github/actions/test-system-io-summary@detox-spec-list # TODO: pin to SHA after mattermost-test-system-io#153 merges
        with:
          framework: detox
          use-staging: "false"
          composite-identity: ${{ needs.prepare.outputs.identity }}
          commit-status-context: e2e-test-stack/${{ inputs.lane }}
          update-commit-status: "false"
          fail-on-test-failures: "true"
          ref-branch: ${{ needs.prepare.outputs.branch }}
          image-tag: ${{ inputs.e2e_test_stack_server_image }}
